name: Build DeckLoom Medium Image Pack

on:
  workflow_dispatch:
    inputs:
      max_images:
        description: "0 = 本番全件。動作確認は 500"
        required: true
        default: "500"
        type: string
      width:
        description: "WebP出力幅(px)"
        required: true
        default: "400"
        type: string
      quality:
        description: "WebP quality"
        required: true
        default: "80"
        type: string
      workers:
        description: "同時ダウンロード数"
        required: true
        default: "4"
        type: choice
        options: ["2","4","6"]
      publish:
        description: "medium-image-pack-latest Releaseへ公開"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: deckloom-medium-image-pack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build Medium pack
        env:
          MAX_IMAGES: ${{ inputs.max_images }}
          WIDTH: ${{ inputs.width }}
          QUALITY: ${{ inputs.quality }}
          WORKERS: ${{ inputs.workers }}
        run: python tools/build_medium_image_pack.py --max-images "$MAX_IMAGES" --width "$WIDTH" --quality "$QUALITY" --workers "$WORKERS"
      - name: Validate publish request
        if: inputs.publish == true
        env:
          MAX_IMAGES: ${{ inputs.max_images }}
        run: |
          if [ "$MAX_IMAGES" != "0" ]; then
            echo "Refusing to publish a partial Medium image pack."
            exit 1
          fi
      - name: Publish summary
        if: always()
        run: |
          if [ -f dist/medium-image-pack/summary.md ]; then cat dist/medium-image-pack/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Create Medium release if missing
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view medium-image-pack-latest >/dev/null 2>&1; then
            gh release create medium-image-pack-latest --title "DeckLoom Medium Image Pack - Latest" --notes "Optional 400px WebP card-image pack. Japanese paper printings are mandatory for cards."
          fi
      - name: Upload Medium release
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload medium-image-pack-latest dist/medium-image-pack/deckloom-medium-images.zip dist/medium-image-pack/medium-image-manifest.json dist/medium-image-pack/medium-image-pack-meta.json --clobber
      - name: Upload metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deckloom-medium-image-pack-${{ github.run_number }}
          path: |
            dist/medium-image-pack/medium-image-manifest.json
            dist/medium-image-pack/medium-image-pack-meta.json
            dist/medium-image-pack/summary.md
            dist/medium-image-pack/failed.json
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup staged images
        if: always()
        run: rm -rf dist/medium-image-pack/images
