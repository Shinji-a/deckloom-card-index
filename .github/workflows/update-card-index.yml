name: Update DeckLoom Card Index

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update-card-index.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update-card-index.yml"
  workflow_dispatch:

  schedule:
    # 毎日 03:17 UTC
    # 日本時間では 12:17ごろ
    - cron: "17 3 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: deckloom-card-index-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Cache downloaded source data
        uses: actions/cache@v4
        with:
          path: .source-cache
          key: japanese-sources-${{ runner.os }}-${{ github.run_id }}
          restore-keys: japanese-sources-${{ runner.os }}-

      - name: Test Japanese printing selection
        run: python -m unittest discover -s tests -v

      - name: Restore verified previous release and durable WHISPER cache
        run: |
          snapshot=$(mktemp -d)
          if gh release download card-index-latest --dir "$snapshot" \
            --pattern manifest.json --pattern deckloom-card-index.sqlite.gz \
            --pattern japanese-enrichment.json --pattern whisper-cache.tar.gz &&
            test -s "$snapshot/japanese-enrichment.json" &&
            python -c 'import sys; from scripts.previous_database import prepare; prepare(sys.argv[1])' "$snapshot"; then
            mv "$snapshot" previous
          else
            echo "::warning::Published assets are incomplete or inconsistent. Restoring the latest successful main run."
            successful_run=$(gh run list --workflow update-card-index.yml --branch main \
              --status success --limit 20 --json databaseId,event \
              --jq 'map(select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")) | .[0].databaseId // empty')
            if [ -z "$successful_run" ]; then
              echo "::error::No successful main run was found for recovery."
              exit 1
            fi
            recovery_snapshot=$(mktemp -d)
            gh run download "$successful_run" --name japanese-db-audit --dir "$recovery_snapshot"
            test -s "$recovery_snapshot/japanese-enrichment.json"
            python -c 'import sys; from scripts.previous_database import prepare; prepare(sys.argv[1])' "$recovery_snapshot"
            mv "$recovery_snapshot" previous
            echo "Restored verified snapshot from run $successful_run."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Recover verified source cache from the last failed main push
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed_run=$(gh run list --workflow update-card-index.yml --branch main \
            --event push --status failure --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$failed_run" ]; then
            if gh run download "$failed_run" --name japanese-db-audit --dir recovery; then
              python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from scripts.previous_database import prepare
          published = json.loads(Path('previous/manifest.json').read_text())
          recovered = json.loads(Path('recovery/manifest.json').read_text())
          if datetime.fromisoformat(recovered['generated_at']) > datetime.fromisoformat(published['generated_at']):
              prepare('recovery')
          PY
            fi
          fi
          # Only source cache is recovered. DECKLOOM_PREVIOUS_DIR remains the
          # verified published release; unpublished card fields are not retained.

      - name: Build Japanese card index
        env:
          DECKLOOM_PREVIOUS_DIR: previous
          # PRs test integration with existing cache; only serialized main runs access WHISPER.
          DECKLOOM_WHISPER_OFFLINE: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
        run: |
          python scripts/build_index.py

      - name: Validate generated database
        env:
          DECKLOOM_PREVIOUS_DIR: previous
        run: python scripts/validate_index.py dist

      - name: Preserve audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-db-audit
          path: |
            dist/japanese-enrichment.json
            dist/japanese-coverage.json
            dist/manifest.json
            dist/deckloom-card-index.sqlite.gz
            dist/whisper-cache.tar.gz
            dist/SOURCES.txt
          if-no-files-found: ignore

      - name: Verify saved localization regression examples before publishing
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/verify_japanese_cards.py dist/deckloom-card-index.sqlite \
            "Outland Liberator // Frenzied Trapbreaker" \
            "Heliod, the Radiant Dawn // Heliod, the Warped Eclipse" \
            "Clarion Conqueror" "Far // Away" \
            "Marang River Regent // Coil and Catch"
          python scripts/verify_japanese_cards.py dist/deckloom-card-index.sqlite --set-code bot

      - name: Show generated files
        run: |
          ls -lh dist/

      - name: Create latest release if missing
        if: github.ref == 'refs/heads/main'
        run: |
          gh release view card-index-latest >/dev/null 2>&1 || \
          gh release create card-index-latest \
            --title "DeckLoom Card Index - Latest" \
            --notes "Automatically generated Japanese card search database for DeckLoom."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload latest database
        if: github.ref == 'refs/heads/main'
        run: |
          upload_asset() {
            local file=$1 output status attempt
            for attempt in 1 2 3; do
              if output=$(gh release upload card-index-latest "$file" --clobber 2>&1); then
                printf '%s\n' "$output"
                return 0
              else
                status=$?
              fi
              printf '%s\n' "$output" >&2
              if [ "$attempt" -eq 3 ] || ! grep -Eq 'HTTP (429|5[0-9]{2})\b' <<< "$output"; then
                return "$status"
              fi
              echo "::warning::Transient GitHub error uploading $file; retrying."
              sleep "$((attempt * 10))"
            done
          }

          for file in \
            dist/deckloom-card-index.sqlite \
            dist/deckloom-card-index.sqlite.gz \
            dist/japanese-coverage.json \
            dist/japanese-enrichment.json \
            dist/whisper-cache.tar.gz \
            dist/SOURCES.txt; do
            upload_asset "$file"
          done
          # Commit the new manifest only after every payload has uploaded.
          upload_asset dist/manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
