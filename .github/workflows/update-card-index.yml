name: Update DeckLoom Card Index

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update-card-index.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update-card-index.yml"
  workflow_dispatch:

  schedule:
    # 毎日 03:17 UTC
    # 日本時間では 12:17ごろ
    - cron: "17 3 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: deckloom-card-index-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Cache downloaded source data
        uses: actions/cache@v4
        with:
          path: .source-cache
          key: japanese-sources-${{ runner.os }}-${{ github.run_id }}
          restore-keys: japanese-sources-${{ runner.os }}-

      - name: Test Japanese printing selection
        run: python -m unittest discover -s tests -v

      - name: Restore verified previous release and durable WHISPER cache
        run: |
          mkdir -p previous
          gh release download card-index-latest --dir previous \
            --pattern manifest.json --pattern deckloom-card-index.sqlite.gz --pattern japanese-enrichment.json
          if gh release view card-index-latest --json assets --jq '.assets[].name' | grep -qx 'whisper-cache.tar.gz'; then
            gh release download card-index-latest --dir previous --pattern whisper-cache.tar.gz
          fi
          python scripts/previous_database.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Recover verified source cache from the last failed main push
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed_run=$(gh run list --workflow update-card-index.yml --branch main \
            --event push --status failure --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$failed_run" ]; then
            if gh run download "$failed_run" --name japanese-db-audit --dir recovery; then
              python -c "from scripts.previous_database import prepare; prepare('recovery')"
            fi
          fi
          # Only source cache is recovered. DECKLOOM_PREVIOUS_DIR remains the
          # verified published release; unpublished card fields are not retained.

      - name: Build Japanese card index
        env:
          DECKLOOM_PREVIOUS_DIR: previous
          # PRs test integration with existing cache; only serialized main runs access WHISPER.
          DECKLOOM_WHISPER_OFFLINE: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
        run: |
          python scripts/build_index.py

      - name: Validate generated database
        env:
          DECKLOOM_PREVIOUS_DIR: previous
        run: python scripts/validate_index.py dist

      - name: Preserve audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-db-audit
          path: |
            dist/japanese-enrichment.json
            dist/japanese-coverage.json
            dist/manifest.json
            dist/deckloom-card-index.sqlite.gz
            dist/whisper-cache.tar.gz
            dist/SOURCES.txt
          if-no-files-found: ignore

      - name: Verify saved localization regression examples before publishing
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/verify_japanese_cards.py dist/deckloom-card-index.sqlite \
            "Outland Liberator // Frenzied Trapbreaker" \
            "Heliod, the Radiant Dawn // Heliod, the Warped Eclipse" \
            "Clarion Conqueror" "Far // Away" \
            "Marang River Regent // Coil and Catch"

      - name: Show generated files
        run: |
          ls -lh dist/

      - name: Create latest release if missing
        if: github.ref == 'refs/heads/main'
        run: |
          gh release view card-index-latest >/dev/null 2>&1 || \
          gh release create card-index-latest \
            --title "DeckLoom Card Index - Latest" \
            --notes "Automatically generated Japanese card search database for DeckLoom."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload latest database
        if: github.ref == 'refs/heads/main'
        run: |
          gh release upload card-index-latest \
            dist/deckloom-card-index.sqlite \
            dist/deckloom-card-index.sqlite.gz \
            dist/japanese-coverage.json \
            dist/japanese-enrichment.json \
            dist/whisper-cache.tar.gz \
            dist/SOURCES.txt \
            --clobber
          gh release upload card-index-latest dist/manifest.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
